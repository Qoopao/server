# 消息服务日志配置示例
logging:
  # 日志级别: debug, info, warn, error, fatal
  level: "info"
  
  # 日志输出路径
  output_paths:
    - "logs/msg.log"      # 消息服务日志
    - "logs/error.log"    # 错误日志
  
  # 错误日志输出路径
  error_output_paths:
    - "logs/error.log"
  
  # 日志格式: json, console
  encoding: "json"
  
  # 是否显示调用者信息
  enable_caller: true
  
  # 是否显示堆栈跟踪
  enable_stacktrace: true
  
  # 时间格式
  time_format: "2006-01-02T15:04:05.000Z07:00"
