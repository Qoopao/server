version: '3.8'

services:
  # 单机版etcd (开发环境)
  etcd-standalone:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: etcd-standalone
    ports:
      - "2379:2379"  # 客户端端口
      - "2380:2380"  # 对等端口
    environment:
      - ETCD_NAME=etcd-standalone
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://localhost:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://localhost:2380
      - ETCD_INITIAL_CLUSTER=etcd-standalone=http://localhost:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-1
    volumes:
      - etcd_data:/etcd-data
    command: etcd
    restart: unless-stopped
    networks:
      - etcd-network

  # 3节点etcd集群 (生产环境)
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: etcd-1
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ETCD_NAME=etcd-1
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-1:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd-1:2380
      - ETCD_INITIAL_CLUSTER=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-1
    volumes:
      - etcd_data_1:/etcd-data
    command: etcd
    restart: unless-stopped
    networks:
      - etcd-network

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: etcd-2
    ports:
      - "2381:2379"
      - "2382:2380"
    environment:
      - ETCD_NAME=etcd-2
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-2:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd-2:2380
      - ETCD_INITIAL_CLUSTER=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-1
    volumes:
      - etcd_data_2:/etcd-data
    command: etcd
    restart: unless-stopped
    networks:
      - etcd-network

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: etcd-3
    ports:
      - "2383:2379"
      - "2384:2380"
    environment:
      - ETCD_NAME=etcd-3
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-3:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-1
    volumes:
      - etcd_data_3:/etcd-data
    command: etcd
    restart: unless-stopped
    networks:
      - etcd-network

  # etcd管理工具 (可选)
  etcd-manager:
    image: nicolaka/netshoot:latest
    container_name: etcd-manager
    depends_on:
      - etcd-standalone
    volumes:
      - ./scripts:/scripts
    working_dir: /scripts
    command: tail -f /dev/null
    networks:
      - etcd-network

  # etcd UI 管理界面
  etcd-ui:
    image: buddho/etcd-ui:latest
    container_name: etcd-ui
    ports:
      - "8084:8080"
    environment:
      - ETCD_HOST=etcd-standalone
      - ETCD_PORT=2379
    depends_on:
      - etcd-standalone
    restart: unless-stopped
    networks:
      - etcd-network

volumes:
  etcd_data:
    driver: local
  etcd_data_1:
    driver: local
  etcd_data_2:
    driver: local
  etcd_data_3:
    driver: local

networks:
  etcd-network:
    driver: bridge
