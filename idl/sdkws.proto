syntax = "proto3";
package sdkws;

option go_package = "github.com/rhp-QE/roc-im-server/kitex_gen/sdkws";

// 包含消息的完整信息，是系统中最核心的消息结构
message MessageData {
  string sendID                    = 1; // 发送者用户ID
  string recvID                    = 2; // 接收者用户ID (单聊时使用)
  string convID                    = 3; // 会话ID (群聊时使用)
  string cMessaegID               = 4; // 客户端生成的消息ID
  string sMessageID               = 5; // 服务器生成的消息ID
  int32  convType                 = 6; // 会话类型 (1:单聊 2:群聊 3:系统通知)
  bytes content                    = 7; // 消息内容 (JSON格式的字节数组)
  int64 seq                        = 8; // 消息序列号
  double sendTime                  = 9; // 消息发送时间戳
  int32 status                     = 10; // 消息状态 (1:发送中 2:发送成功 3:发送失败 4:已删除 5:已撤回)
  bool isRead                      = 11; // 是否已读
  bool isDeleted                   = 12; // 是否已删除
  bool isRecalled                  = 13; // 是否已撤回
  bool isPinned                    = 14; // 是否已置顶
  string syncExt                   = 15; // 同步扩展字段
  int32 dStatus                    = 16; // 状态， 二进制掩码  0：实时消息 1：离线消息（没有被接收过） 2：消息更新
  string propertys                 = 17; // 消息属性
}

// 会话信息
message ConversationData {
  string convID = 1;          // 会话ID
  string ownerID = 2;     // 会话拥有者用户ID
  int32 convType = 3;         // 会话类型
  int64 version = 4;          // 会话版本
  repeated MessageData messages = 5;  // 会话消息列表
  MessageData lastMessage = 6;        // 会话最后一条消息
  string lastMessageID = 7; // 会话最后一条消息ID
  int64 unreadCount = 8;  // 会话未读消息数量
  bool isMuted = 9;           // 会话是否静音
  bool isTop = 10;             // 会话是否置顶
  bool isDelete = 11;
  bool isBlocked = 12;
  string syncExt = 13;
  string members = 14;
  string name = 15;
  string avatarURL = 16;
}



// 发送消息 --------------------------------
message SendMessageResult {
  string errorCode = 1;                 // 错误码
  string errorMsg = 2;                  // 错误信息
  MessageData msg = 3;                      // 消息
}

message BatchSendMessageRequest {
  repeated MessageData msgs = 1; // 消息列表
}

message BatchSendMessageResponse {
  repeated SendMessageResult results = 1;
}
// ----------------------------------------


// 命令消息 -----------------------------------
message CmdMessage {
  int32 cmd                 = 1;
  int32 id   = 2;
  // 1001 : 消息状态发生改变 (发送成功、发送失败、删除、撤回)
  // 1002 : 已读状态 发生改变
  // 1003 : 置顶状态 发生改变
  // 1004 : property 发生改变
  // 1005 : 消息syncExt 发生变化

  // 2001 : 会话状态发生改变 (删除) 会话创建走的另一个接口
  // 2002 : 会话已读状态发生改变
  // 2003 : 置顶状态发生改变
  // 2004 :
  // 2005 : 会话syncExt 发生改变
  MessageData message               = 3;
  ConversationData conversation = 4;
  int64 cursor = 5;
}

message CmdMessageOptResult {
  int32 cmd = 1;
  int32 id  = 2;
  int32 errorCode = 3;
  string error = 4;
}


// 更改消息请求 --------------------------------
message BatchChangeMessagesRequest {
  repeated CmdMessage cmdMessages = 1;
}

message BatchChangeMessagesResponse {
  repeated CmdMessageOptResult results = 1; 
}
// -------------------------------------------

// 更改会话请求 --------------------------------
message BatchChangeConversationsRequest {
  repeated CmdMessage cmdMessages = 1;
}

message BatchChangeConversationsResponse {
  repeated CmdMessageOptResult results = 1;
}
// -------------------------------------------

// 单链拉取 ------------------------------------
message FetchConvMessageListRequest {
  string convID  = 1;
  int64 cursor   = 2;
  int64 limit    = 3;
  bool  forward  = 4;
}

message FetchConvMessageListResponse {
  repeated MessageData messages = 1;
  bool haveMore = 2;
  int32 errorCode = 3;
  string error = 4;
}
// --------------------------------------------

// 混链拉取 ------------------------------------
message FetchUserRecentConvListRequest {
  string userID = 1;
  int64 cursor  = 2; // 水位
  int64 limit   = 3;
  bool forward  = 4;
  bool news     = 5; // 是否拉取新消息
}

message FetchUserRecentConvListResponse {
  repeated ConversationData conversations = 1;
  int64 left = 2; // 左右闭合
  int64 right = 3;
  bool hasMore = 4;
}
//---------------------------------------------

// 混链连续性检查 -------------------------------
message UserMessageIntegrityCheckRequest {
  string userID           = 1; // 用户ID
  int64 left              = 2; // 左区间
  int64 right             = 3; // 右区间
  repeated string convIDs = 4; // 会话ID列表
}

message UserMessageIntegrityCheckResponse {
  bool isIntegrity                    = 1; // 是否完整
  int64 left                          = 2; // 左右闭合
  int64 right                         = 3; // 右区间
  repeated ConversationData conversations = 4; // 补齐的会话信息
}
// --------------------------------------------

// 批量获取消息 ------------------------------------
message GetMessageResult {
  string messageID = 1; // 请求的消息ID
  MessageData message = 2; // 消息数据（如果获取成功）
  string errorCode = 3; // 错误码（如果获取失败）
  string errorMsg = 4; // 错误信息（如果获取失败）
}

message BatchGetMessagesRequest {
  repeated string messageIDs = 1; // 消息ID列表
  string convID = 2; // 会话ID（可选，用于过滤）
}

message BatchGetMessagesResponse {
  repeated GetMessageResult results = 1; // 结果列表，每个结果包含消息和对应的错误信息
}
// --------------------------------------------

// 批量获取会话 ------------------------------------
message GetConversationResult {
  string convID = 1; // 请求的会话ID
  ConversationData conversation = 2; // 会话数据（如果获取成功）
  string errorCode = 3; // 错误码（如果获取失败）
  string errorMsg = 4; // 错误信息（如果获取失败）
}

message BatchGetConversationsRequest {
  repeated string convIDs = 1; // 会话ID列表
  string ownerID = 2; // 会话拥有者用户ID（可选，用于过滤）
}

message BatchGetConversationsResponse {
  repeated GetConversationResult results = 1; // 结果列表，每个结果包含会话和对应的错误信息
}
// --------------------------------------------
